<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DALIGO Rider</title>
<meta name="theme-color" content="#12318A">
<link rel="manifest" href="manifest-rider.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,600;1,900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="daligo.css">
</head>
<body>
<header class="top">
  <div style="width:44px"></div>
  <div class="logo"><div class="w"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><g fill="#FFC31A"><rect x="0" y="2" width="22" height="4" rx="2"/><rect x="7" y="9" width="22" height="4" rx="2"/><rect x="0" y="16" width="16" height="4" rx="2"/></g></svg><span>DALI<b>GO</b></span></div><p><span class="role">Rider</span></p></div>
  <div class="av hide" id="avatar"><i id="av">D</i><span id="avn"></span></div>
</header>
<main>
<form id="rsignup" class="box hide" novalidate>
  <b>Apply to be a rider</b>
  <p class="hint">Upload clear photos. The admin checks your documents before you can take jobs.</p>
  <label for="rn">Full name</label><input id="rn" autocomplete="name">
  <label for="rp">Mobile number</label><input id="rp" type="tel" inputmode="tel" autocomplete="tel">
  <label for="re">Email</label><input id="re" type="email" autocomplete="email">
  <label for="rpw">Password (6 or more characters)</label><input id="rpw" type="password" autocomplete="new-password">
  <label for="rpl">Motorcycle plate number</label><input id="rpl" autocapitalize="characters">
  <div id="docs-signup"></div>
  <label class="chk"><input id="rc" type="checkbox">I agree that Butuan Delivery keeps my documents to check my application. Only the admin can see them.</label>
  <button class="go" type="submit">Send application</button>
  <p id="rmsg" class="err" role="status"></p>
</form>
<div id="rstate" class="box hide">
  <p id="rst"></p>
  <form id="rredo" class="hide" novalidate>
    <div id="docs-redo"></div>
    <button class="sm" type="submit">Send documents again</button>
  </form>
</div>
<form id="login" class="box hide" novalidate>
  <b>Sign in</b>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="go" type="submit">Sign in</button>
  <p id="lmsg" class="err" role="status"></p>
</form>
<div id="who" class="box hide"><span id="whotxt"></span> <button class="sm" id="out" type="button">Sign out</button></div>
<div id="app" class="hide">
  <section id="vjobs"><h2 class="greet" id="greet" style="margin-bottom:6px">Your jobs</h2><p id="gps" class="hint"></p><div id="rjobs"></div></section>
  <section id="vprofile" class="hide">
    <h2 class="greet" style="margin-bottom:14px">Profile</h2>
    <div class="box"><b id="pname"></b><p id="pinfo" class="hint"></p><p id="pplate" class="hint"></p><p><span class="st">Approved rider</span></p><button class="sm" id="out2" type="button">Sign out</button></div>
  </section>
</div>
</main>
<nav id="tabs" class="hide">
  <button type="button" data-t="vjobs" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Jobs</button>
  <button type="button" data-t="vprofile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script>
var DOCS = [["license", "Driver's license"], ["orPhoto", "OR (Official Receipt)"], ["crPhoto", "CR (Certificate of Registration)"], ["front", "Motorcycle front, plate number visible"], ["back", "Motorcycle back, plate number visible"]];
var LIMIT = 170000, rid = null, loaded = false, busy = false;
function buildDocs(box, p){
  DOCS.forEach(function(d){
    var l = el("label", d[1]), i = el("input"); l.htmlFor = p + d[0]; i.type = "file"; i.accept = "image/*"; i.id = p + d[0];
    box.appendChild(l); box.appendChild(i);
  });
}
buildDocs($("docs-signup"), "s_"); buildDocs($("docs-redo"), "r_");
function hasDocs(p){ return DOCS.every(function(d){ return $(p + d[0]).files[0]; }); }
function readDocs(p){
  return Promise.all(DOCS.map(function(d){ return squeezeTo($(p + d[0]).files[0], LIMIT); })).then(function(urls){
    var o = {}; DOCS.forEach(function(d, i){ o[d[0]] = urls[i]; }); return o;
  });
}
function role(){ if (!user) return "none"; if (isAdmin()) return "admin"; if (busy || !loaded) return "loading"; return rid ? "rider" : "nodoc"; }
function refresh(){
  var r = role(), ok = r === "rider" && rid.status === "approved";
  $("rsignup").classList.toggle("hide", !!user);
  var note = r === "admin" ? "This is the admin account. Use a rider account on this page." :
    r === "nodoc" ? "This account has no rider application. Sign out and apply with a different email." :
    r === "rider" && rid.status === "pending" ? "Your documents are being reviewed. You can take jobs as soon as the admin approves you." :
    r === "rider" && rid.status === "rejected" ? "Your application was not approved. Send clearer photos of all 5 documents." : "";
  $("rst").textContent = note;
  $("rstate").classList.toggle("hide", !note);
  $("rredo").classList.toggle("hide", !(r === "rider" && rid.status === "rejected"));
  $("app").classList.toggle("hide", !ok); $("tabs").classList.toggle("hide", !ok); $("avatar").classList.toggle("hide", !ok); $("who").classList.toggle("hide", !user || ok);
  if (ok){
    var fn = rid.name.split(" ")[0];
    $("av").textContent = fn.charAt(0).toUpperCase(); $("avn").textContent = fn; $("greet").textContent = "Hi, " + fn + "! Your jobs";
    $("pname").textContent = rid.name; $("pinfo").textContent = rid.phone + " · " + rid.email; $("pplate").textContent = "Plate: " + rid.plate;
  }
  if (ok) watchRider(); else { stop("rider"); $("rjobs").textContent = ""; stopGeo(); }
}
startAuth(function(u){
  rid = null; loaded = false;
  if (u && !isAdmin()) unsubs.me = db.collection("riders").doc(u.uid).onSnapshot(function(d){ rid = d.exists ? d.data() : null; loaded = true; refresh(); }, function(){ loaded = true; refresh(); });
  refresh();
});
$("rsignup").addEventListener("submit", function(e){
  e.preventDefault();
  var g = function(i){ return $(i).value.trim(); }, m = $("rmsg"), docs;
  if (!g("rn") || !g("rp") || !g("re") || !g("rpl") || $("rpw").value.length < 6 || !hasDocs("s_")){ m.className = "err"; m.textContent = "Fill in every field, use a password of 6 or more characters, and add all 5 photos."; return; }
  if (!$("rc").checked){ m.className = "err"; m.textContent = "Please agree to the document check first."; return; }
  busy = true; m.className = "hint"; m.textContent = "Sending your application. This can take a minute…";
  readDocs("s_").then(function(o){ docs = o; return auth.createUserWithEmailAndPassword(g("re"), $("rpw").value); })
    .then(function(cr){
      var data = { name: g("rn"), phone: g("rp"), email: g("re").toLowerCase(), plate: g("rpl").toUpperCase(), status: "pending", createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      DOCS.forEach(function(d){ data[d[0]] = docs[d[0]]; });
      return db.collection("riders").doc(cr.user.uid).set(data);
    })
    .then(function(){ m.textContent = ""; $("rsignup").reset(); })
    .catch(function(err){ m.className = "err"; m.textContent = err && err.code === "auth/email-already-in-use" ? "That email is already registered. Sign in below." : "Could not send the application. Check your details and internet."; })
    .then(function(){ busy = false; refresh(); });
});
$("rredo").addEventListener("submit", function(e){
  e.preventDefault();
  if (!hasDocs("r_")){ $("rst").textContent = "Add all 5 photos."; return; }
  $("rst").textContent = "Sending…";
  readDocs("r_").then(function(o){ o.status = "pending"; return db.collection("riders").doc(user.uid).update(o); })
    .catch(function(){ $("rst").textContent = "Could not send. Try again."; });
});
function watchRider(){
  if (unsubs.rider) return;
  var box = $("rjobs");
  unsubs.rider = col.where("riderEmail", "==", user.email.toLowerCase()).onSnapshot(function(sn){ draw(box, sn, "rider", "No jobs for you right now."); trackJobs(sn); }, fail(box));
}
// ---- live location (shared only while a job is active) ----
var geo = null, jobs = [], last = { t: 0, lat: 0, lng: 0 };
function trackJobs(sn){
  jobs = [];
  sn.forEach(function(d){ var st = d.data().status; if (st === "assigned" || st === "picked_up") jobs.push(d.ref); });
  if (jobs.length && geo === null && navigator.geolocation){
    geo = navigator.geolocation.watchPosition(onPos, function(){ $("gps").textContent = "Turn on your phone location so customers can see you."; }, { enableHighAccuracy: true, maximumAge: 5000 });
  }
  if (!jobs.length) stopGeo();
  else if (!$("gps").textContent) $("gps").textContent = "Sharing your live location with your customers.";
}
function onPos(p){
  var now = Date.now(), lat = p.coords.latitude, lng = p.coords.longitude;
  if (now - last.t < 10000) return;
  if (Math.abs(lat - last.lat) < 0.00015 && Math.abs(lng - last.lng) < 0.00015 && now - last.t < 60000) return;
  last = { t: now, lat: lat, lng: lng };
  $("gps").textContent = "Sharing your live location with your customers.";
  jobs.forEach(function(ref){ ref.update({ riderLat: lat, riderLng: lng, riderAt: now }); });
}
function stopGeo(){ if (geo !== null){ navigator.geolocation.clearWatch(geo); geo = null; } jobs = []; $("gps").textContent = ""; }
function go(t){
  ["vjobs", "vprofile"].forEach(function(x){ $(x).classList.toggle("hide", x !== t); });
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === t); });
  window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach(function(b){ b.onclick = function(){ go(b.dataset.t); }; });
$("out2").onclick = function(){ auth.signOut(); };
</script>
</body>
</html>
