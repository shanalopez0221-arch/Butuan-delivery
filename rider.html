<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Butuan Delivery Rider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Butuan Delivery Rider</h1>
  <p>Your jobs. Take a photo at pickup and at delivery.</p>
</header>
<main>
<form id="login" class="box hide" novalidate>
  <b>Sign in</b>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="go" type="submit">Sign in</button>
  <p id="lmsg" class="err" role="status"></p>
</form>
<div id="who" class="box hide"><span id="whotxt"></span> <button class="sm" id="out" type="button">Sign out</button></div>
<div id="rjobs"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script>
startAuth(function(u){
  var box = $("rjobs"); box.textContent = ""; box.classList.remove("box", "err");
  if (u) watchRider();
});
function watchRider(){
  if (unsubs.rider) return;
  var box = $("rjobs");
  unsubs.rider = col.where("riderEmail", "==", user.email.toLowerCase()).onSnapshot(function(sn){ draw(box, sn, "rider", "No jobs for you right now."); }, fail(box));
}
</script>
</body>
</html>
